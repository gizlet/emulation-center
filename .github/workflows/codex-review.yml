name: Codex review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: Review the handheld UI and controls, Store API and download handling, package installation through the gizlet CLI, emulator hand-off and process supervision, TF2 and folder detection, and ARM64 packaging.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
